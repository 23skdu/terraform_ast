name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test (100% Coverage & Terratest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: Verify Module Cleanliness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build Binary
        run: |
          go build -v -o bin/tfastdiff ./cmd/tfastdiff/main.go

      - name: Run Test Suite with Coverage
        run: |
          go test -v -cover ./...

      - name: Run Terratest Suite
        run: |
          go test -v ./test/terratest
