name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test (Coverage & Terratest)
    runs-on: ubuntu-latest
    # The full suite is fast now that the registry retry budget is bounded in tests, but the
    # container build and the 19 fuzz targets still take minutes. Bound it explicitly instead of
    # relying on the 360 minute default, so a hang fails fast and legibly.
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Lint (govet, errcheck, staticcheck, unused, gosec)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.5'

      - name: Verify Module Cleanliness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build Binary
        run: |
          go build -v -o bin/tfastdiff ./cmd/tfastdiff/main.go

      - name: Run Unit Suite with 100% Coverage Gate
        run: |
          go test -timeout 15m -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(tail -1 coverage.txt | awk '{print $NF}')
          if [ "$total" != "100.0%" ]; then
            echo "total statement coverage is $total, expected 100.0%" >&2
            grep -v '100.0%' coverage.txt >&2
            exit 1
          fi

      - name: Run Terratest Suite
        run: |
          go test -timeout 15m -v ./test/terratest

      - name: Race Detector
        run: go test -timeout 20m -race ./...

      - name: Fuzz Smoke Run
        run: ./scripts/verify.sh 30
