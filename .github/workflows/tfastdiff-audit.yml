name: Terraform AST Compatibility Audit

on:
  workflow_call:
    inputs:
      wrapper_path:
        description: Path to the Terraform wrapper module
        required: true
        type: string
      upstream:
        description: Registry source, local path, or Git repository URL
        required: true
        type: string
      new_version:
        description: Upstream version or Git tag to audit
        required: true
        type: string
      blast_radius:
        description: Optional path to downstream consumer modules
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Generate Markdown compatibility report
        id: markdown
        continue-on-error: true
        env:
          WRAPPER_PATH: ${{ inputs.wrapper_path }}
          UPSTREAM: ${{ inputs.upstream }}
          NEW_VERSION: ${{ inputs.new_version }}
          BLAST_RADIUS: ${{ inputs.blast_radius }}
        run: |
          args=(--wrapper "$WRAPPER_PATH" --upstream "$UPSTREAM" --new-version "$NEW_VERSION" --format markdown --output "$RUNNER_TEMP/tfastdiff.md")
          if [[ -n "$BLAST_RADIUS" ]]; then
            args+=(--blast-radius "$BLAST_RADIUS")
          fi
          go run ./cmd/tfastdiff "${args[@]}" --exit-code
      - name: Generate SARIF results
        if: always()
        env:
          WRAPPER_PATH: ${{ inputs.wrapper_path }}
          UPSTREAM: ${{ inputs.upstream }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          go run ./cmd/tfastdiff \
            --wrapper "$WRAPPER_PATH" \
            --upstream "$UPSTREAM" \
            --new-version "$NEW_VERSION" \
            --format sarif \
            --output "$RUNNER_TEMP/tfastdiff.sarif"
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/tfastdiff.sarif
      - name: Upsert pull request summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tfastdiff-compatibility-report -->';
            const reportPath = `${process.env.RUNNER_TEMP}/tfastdiff.md`;
            if (!fs.existsSync(reportPath)) {
              core.warning('tfastdiff Markdown report was not generated');
              return;
            }
            const body = `${marker}\n${fs.readFileSync(reportPath, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Enforce compatibility gate
        if: steps.markdown.outcome == 'failure'
        run: exit 1
